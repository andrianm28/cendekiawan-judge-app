AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CendekiAwan Grand Final judging (API + DynamoDB + static web)

Parameters:
  TokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random string (32+ chars) used to sign login tokens
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Web origin allowed to call the API (the CloudFront URL once known)
  CustomDomain:
    Type: String
    Default: ''
    Description: Optional domain for the web app, e.g. panel.cendekiawan.eliteacademy.id
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in us-east-1 covering CustomDomain (the *.cendekiawan.eliteacademy.id wildcard)

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # SAM cannot take an Fn::If around the whole list, so only the second entry is
        # conditional (it repeats AllowedOrigin when there is no custom domain).
        AllowOrigins:
          - !Ref AllowedOrigin
          - !If [HasCustomDomain, !Sub 'https://${CustomDomain}', !Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      # Slows PIN guessing; the whole event is ~6 tablets.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          TOKEN_SECRET: !Ref TokenSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Any:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: '/{proxy+}', Method: ANY }

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-web'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: !If [HasCustomDomain, [!Ref CustomDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOac
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebCdn}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  WebUrl:
    Value: !If [HasCustomDomain, !Sub 'https://${CustomDomain}', !Sub 'https://${WebCdn.DomainName}']
  WebBucketName:
    Value: !Ref WebBucket
  TableName:
    Value: !Ref Table
